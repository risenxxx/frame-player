name: Release

on:
  push:
    branches: [main]
    paths:
      - 'src-tauri/tauri.conf.json'

env:
  CARGO_TERM_COLOR: always

# One release at a time. Two in flight could both find no published library set,
# both build it, and both publish — and the second `latest.json` would win while
# the first release's files were still uploading.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tauri.conf.json
        id: check
        run: |
          VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # Check if tag already exists
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists"
            echo "should_release=false" >> $GITHUB_OUTPUT
          else
            echo "Tag v$VERSION does not exist, will create release"
            echo "should_release=true" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    strategy:
      # Both artifacts are needed for a complete latest.json, so let each
      # platform report its own failure instead of canceling its sibling.
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
            runner: windows-latest
            rust_target: x86_64-pc-windows-msvc
          # Apple Silicon only. Intel would be a second entry here (macos-26-intel
          # + darwin-x86_64); see FINDINGS-macos.md for why it is not worth it yet.
          #
          # The runner must be NO OLDER than the macOS users run: macOS gates
          # behavior changes on the SDK version a binary is linked against. A
          # build made on macos-15 (SDK 15.5) got the old window chrome on
          # macOS 26 — different traffic-light spacing, and our padding offset
          # reset — even though the code in the binary was correct.
          - platform: darwin-aarch64
            runner: macos-26
            rust_target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.platform }}

      # --- Windows native SDKs -------------------------------------------------
      # libmpv (LGPL), libmpv-wrapper, the FFmpeg SDK (LGPL) and libclang for
      # bindgen. The Actions cache is free (it does not count against storage
      # billing; 10 GB per repository with LRU eviction), so the download only
      # runs when the script itself changed.
      - name: Cache native SDKs (Windows)
        if: runner.os == 'Windows'
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/lib
            src-tauri/ffmpeg
            src-tauri/tools
          key: native-sdks-${{ runner.os }}-${{ hashFiles('scripts/fetch-libs.ps1') }}

      - name: Fetch native SDKs (Windows)
        if: runner.os == 'Windows' && steps.sdk-cache.outputs.cache-hit != 'true'
        run: powershell -ExecutionPolicy Bypass -File scripts/fetch-libs.ps1

      # --- macOS native libs ---------------------------------------------------
      # Downloaded, not built. The set is produced once by the `macOS libs`
      # workflow and published to R2; this reads it, verifies its checksum and
      # re-checks its licenses. Twenty-odd megabytes against a twenty-minute
      # source build of FFmpeg and mpv.
      #
      # It replaces an `actions/cache` around that build, which looked equivalent
      # and was not: GitHub evicts a cache after seven days without a hit, so any
      # gap between releases longer than a week paid the whole compile again — on
      # the critical path, every time. Windows has fetched prebuilt libraries
      # from the start; this is the macOS half of that.
      - name: Native libs (macOS)
        if: runner.os == 'macOS'
        env:
          FP_LIBS_URL: ${{ vars.R2_PUBLIC_URL_LIBS }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_BUCKET: ${{ vars.R2_BUCKET_LIBS }}
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          set -euo pipefail
          name="$(scripts/macos-libs-key.sh)"
          if curl -fsI --retry 2 "${FP_LIBS_URL%/}/$name.tar.gz" >/dev/null 2>&1; then
            scripts/fetch-macos-libs.sh
          else
            # No set published for these sources. Build one here rather than
            # failing the release: forgetting to run the `macOS libs` workflow
            # after touching a pinned version is the likeliest way this breaks,
            # and it would break at the least convenient moment.
            echo "::notice::no published set for $name — building it (~20 min)"
            echo "built \`$name\` from source" >> "$GITHUB_STEP_SUMMARY"
            command -v aws >/dev/null || brew install -q awscli
            scripts/build-macos-libs.sh
            # Published, so the next release reads it instead of rebuilding —
            # and **without** `--retain`: a release from an old tag pruning here
            # would delete the set the main branch needs, which the next release
            # would rebuild and prune in turn. Only the manual workflow prunes.
            scripts/publish-macos-libs.sh
          fi

      - name: Install dependencies
        run: npm ci

      # The last point at which a shipped library can still be caught without an
      # attribution. On macOS the set is on disk by now, so this compares the
      # notices against what is actually about to be bundled; on Windows the
      # libraries are DLLs the manifest also names, and the check still verifies
      # the committed file is the one the inputs render to.
      - name: Notices are current
        run: node scripts/gen-notices.mjs --check

      # --- Build ---------------------------------------------------------------
      # FP_OPENSUBTITLES_KEY is the application key for subtitle search. It
      # identifies the program rather than the user (OpenSubtitles bans apps that
      # make their users register keys of their own), so it is baked into the
      # binary with option_env! and is not really a secret: a leak costs
      # availability rather than privacy — the key gets revoked and the feature
      # breaks for everyone at once. That is also the reason for the lookup order
      # in opensubtitles.rs: a file in app_data overrides the compiled-in value,
      # so a revoked key can be replaced without cutting a release. With the
      # secret unset the build still succeeds; subtitle search is simply
      # disabled in it and says so.
      - name: Build Tauri app (Windows)
        if: runner.os == 'Windows'
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          FP_OPENSUBTITLES_KEY: ${{ secrets.FP_OPENSUBTITLES_KEY }}

      # --- macOS signing -------------------------------------------------------
      # Imports the Developer ID and signs the native library set. Both halves
      # have to happen before the build: the keychain because the build step
      # signs the app with the same identity, and the libraries because Tauri
      # copies them in as resources without touching their signatures — see the
      # script's header for why re-signing them afterwards is the wrong shape.
      #
      # With no certificate configured this is a no-op and everything below
      # falls back to the ad-hoc signature the project shipped for its first
      # thirty releases: sealed but uncertified, which Gatekeeper stops with an
      # Open Anyway button rather than the "file is damaged" dead end.
      - name: Sign native libraries (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: scripts/macos-sign.sh

      # The one artefact worth carrying between runs. Everything else this job
      # needs is already reused — the library set is fetched prebuilt from R2 and
      # cargo's dependency cache is restored above — but the app itself is a
      # ten-minute compile that a notarisation failure would otherwise repeat for
      # nothing, since Apple's verdict says nothing about the code being wrong.
      #
      # Keyed on the commit, so it can only ever serve the build of the very
      # sources being released; a re-run of a failed job restores it and goes
      # straight to the part that failed. Saved immediately after the build and
      # before notarisation, so what comes back is always a pre-ticket bundle
      # (stapling it twice would be harmless anyway — the operation is idempotent).
      - name: Restore built app (macOS)
        if: runner.os == 'macOS'
        id: app-cache
        uses: actions/cache/restore@v4
        with:
          path: src-tauri/target/release/bundle/macos
          key: mac-app-${{ github.sha }}-${{ needs.check-version.outputs.version }}

      # FP_OPENSUBTITLES_KEY is baked in with option_env!, so it is an input to
      # the binary the cache above holds. Rotating it between a failed run and
      # its re-run would leave the old key in the restored app — the one way this
      # cache can be wrong, and the fix is to push a commit rather than re-run.
      - name: Build Tauri app (macOS)
        if: runner.os == 'macOS' && steps.app-cache.outputs.cache-hit != 'true'
        run: npm run tauri:macos:build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          FP_OPENSUBTITLES_KEY: ${{ secrets.FP_OPENSUBTITLES_KEY }}
          # Signs the bundle with the Developer ID, applies the hardened runtime
          # and the JIT entitlement from tauri.macos.conf.json, and stops there.
          # The notarisation credentials are deliberately NOT in this step's
          # environment: Tauri would then notarise the .app itself, in an order
          # decided by the bundler, and the disk image — which it does not build
          # — would still need doing separately. One script does both, below.
          #
          # **So this step logs "Warn skipping app notarization, no APPLE_ID …
          # environment variables found", and that line is this decision rather
          # than a fault.** The thing it would otherwise do is the part that has
          # to happen after the build: the updater archive is written during it,
          # so a ticket stapled by the bundler may or may not reach the archive
          # depending on internals we do not control.
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}

      - name: Save built app (macOS)
        if: runner.os == 'macOS' && steps.app-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: src-tauri/target/release/bundle/macos
          key: mac-app-${{ github.sha }}-${{ needs.check-version.outputs.version }}

      # Before the disk image, so the image is built around a bundle that already
      # carries its ticket. This step also repacks the updater archive, which
      # Tauri wrote during the build and which is therefore a copy of the app
      # from before the ticket existed.
      - name: Notarise the app (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: scripts/macos-notarize.sh "src-tauri/target/release/bundle/macos/Frame Player.app"

      # Tauri lays out its dmg with bundle_dmg.sh, which places the icons by
      # driving Finder over AppleScript. A headless runner has no Finder session:
      # the step passes silently and without error, but no .DS_Store reaches the
      # image — and the user's Finder then shows that dmg as an ordinary folder
      # with default icons. Measured on release 0.16.1: a locally built image has
      # a .DS_Store (iconSize 128, a 660x400 window with no toolbar), the release
      # one has none at all. dmgbuild writes .DS_Store directly, so the dmg is a
      # step of its own and bundle.targets on macOS stays ["app"].
      - name: Build DMG (macOS)
        if: runner.os == 'macOS'
        run: |
          # The runner's python is externally managed; a plain pip install refuses.
          python3 -m venv "$RUNNER_TEMP/dmgvenv"
          "$RUNNER_TEMP/dmgvenv/bin/pip" install --quiet dmgbuild
          DMGBUILD="$RUNNER_TEMP/dmgvenv/bin/dmgbuild" scripts/build-dmg.sh

      # The image gets a ticket of its own. The app inside it already has one,
      # which is what decides whether the player launches — but the image is
      # what the user downloads, and an unnotarised one is refused on the way to
      # opening it, so the app's ticket never gets a chance to matter.
      - name: Notarise the DMG (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          # By name, never by glob. `build-dmg.sh` derives this name from the
          # version, and a leftover image from an earlier build sorts before it
          # as often as not — measured locally, a glob picked a stale 0.16.1
          # image over the 0.33.0 one that had just been written, and Apple duly
          # rejected 93 paths inside an app nobody was shipping. On a clean
          # runner there is only ever one file, which is exactly what makes this
          # the kind of bug that waits.
          version="${{ needs.check-version.outputs.version }}"
          dmg="src-tauri/target/release/bundle/dmg/Frame Player_${version}_aarch64.dmg"
          [ -f "$dmg" ] || { echo "no dmg at $dmg" >&2; ls -la src-tauri/target/release/bundle/dmg/ >&2; exit 1; }
          scripts/macos-notarize.sh "$dmg"

      # --- Stage -------------------------------------------------------------
      # Each platform stages its own files plus a manifest fragment,
      # platform-<key>.json, into dist/. The publish job merges them into one
      # latest.json — otherwise the platforms would overwrite each other's
      # manifest in R2.
      - name: Stage artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $version = "${{ needs.check-version.outputs.version }}"
          $exe = Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          # space-free name -> clean URLs in the update manifest
          $name = "FramePlayer_${version}_x64-setup.exe"
          Copy-Item $exe.FullName "dist/$name"
          $sig = (Get-Content "$($exe.FullName).sig" -Raw).Trim()
          # A variable, like the bucket names: this address is printed in the
          # README and fetched by every client on every update check, so it was
          # never a secret — and masking it made the manifest unreadable in the
          # log of the one job that writes it.
          $base = "${{ vars.R2_PUBLIC_URL_UPDATES }}".TrimEnd('/')
          # Unset would produce `/FramePlayer_….exe` in the manifest: a relative
          # URL that fails at the client, days later, with nothing here to show.
          if (-not $base) { Write-Error "R2_PUBLIC_URL_UPDATES is not set"; exit 1 }
          @{ "windows-x86_64" = @{ signature = $sig; url = "$base/$name" } } |
            ConvertTo-Json -Depth 4 |
            Set-Content "dist/platform-windows-x86_64.json" -Encoding utf8

      - name: Stage artifacts (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          mkdir -p dist
          version="${{ needs.check-version.outputs.version }}"
          # The image is named, not globbed — and it has to be the same one the
          # notarisation step chose, or a release ships an image without a
          # ticket while a different one carries it. `build-dmg.sh` builds this
          # name out of the version, so both steps derive it the same way.
          dmg="src-tauri/target/release/bundle/dmg/Frame Player_${version}_aarch64.dmg"
          [ -f "$dmg" ] || { echo "no dmg at $dmg" >&2; exit 1; }
          # The macOS updater installs the .app.tar.gz, not the .dmg — the dmg
          # is only for the first, manual install. This one keeps its glob: the
          # bundle directory holds exactly one, named after the product rather
          # than the version, and `macos-notarize.sh` rewrites it in place.
          shopt -s nullglob
          tgzs=(src-tauri/target/release/bundle/macos/*.app.tar.gz)
          tgz="${tgzs[0]}"
          dmg_name="FramePlayer_${version}_aarch64.dmg"
          tgz_name="FramePlayer_${version}_aarch64.app.tar.gz"
          cp "$dmg" "dist/$dmg_name"
          cp "$tgz" "dist/$tgz_name"
          sig=$(tr -d '\n' < "$tgz.sig")
          base="${{ vars.R2_PUBLIC_URL_UPDATES }}"
          [ -n "$base" ] || { echo "R2_PUBLIC_URL_UPDATES is not set" >&2; exit 1; }
          base="${base%/}"
          jq -n --arg s "$sig" --arg u "$base/$tgz_name" \
            '{"darwin-aarch64": {signature: $s, url: $u}}' \
            > "dist/platform-darwin-aarch64.json"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}
          path: dist
          retention-days: 1

  publish:
    # Both platforms are required: publish must not start if one of them failed,
    # or latest.json gets half a manifest and the other half of the users are
    # left without updates.
    needs: [check-version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # This job used to consist of downloaded artifacts and nothing else, which
      # is why it had no checkout — and then the retention sweep below started
      # calling a script from the repository and the job died with a 127 *after*
      # the upload, i.e. with the release already published and only the pruning
      # missing.
      #
      # **It has to come first.** `actions/checkout` clears the workspace before
      # cloning, so run after the download it would delete `dist` — the artifacts
      # this job exists to publish — and the failure would look like the build
      # producing nothing.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      - name: Build update manifest
        run: |
          set -euo pipefail
          ls -la dist
          version="${{ needs.check-version.outputs.version }}"
          # The per-platform fragments merge into a single platforms object.
          jq -s 'add' dist/platform-*.json > platforms.json
          jq -n \
            --arg v "$version" \
            --arg d "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --slurpfile p platforms.json \
            '{version: $v, pub_date: $d, platforms: $p[0]}' > dist/latest.json
          rm dist/platform-*.json
          cat dist/latest.json

      - name: Upload to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # R2 and newer AWS CLI checksum defaults disagree — relax both
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          set -euo pipefail
          endpoint="https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          bucket="${{ vars.R2_BUCKET_UPDATES }}"
          # A variable rather than a secret: a bucket name is not a credential —
          # the token is — and this one's public domain is in the README already.
          # Masking it would only turn every `s3://…` in this log into `***`.
          # Checked rather than assumed: an unset variable would otherwise upload
          # to `s3:///latest.json` and the failure would name a path, not a cause.
          [ -n "$bucket" ] || { echo "R2_BUCKET_UPDATES is not set" >&2; exit 1; }
          # Binaries first, latest.json last: until it is updated, no client
          # learns about a version whose files are not uploaded yet.
          for f in dist/*; do
            [ "$(basename "$f")" = "latest.json" ] && continue
            aws s3 cp "$f" "s3://$bucket/$(basename "$f")" --endpoint-url "$endpoint"
          done
          aws s3 cp dist/latest.json "s3://$bucket/latest.json" \
            --content-type application/json --cache-control no-cache --endpoint-url "$endpoint"

          # Prune old versions, and only now — after `latest.json` names this
          # one. Whole versions go at a time, and `latest.json` is untouched
          # because it matches no version group. The `.exe` and `.dmg` of a
          # pruned version stay on its GitHub Release, so nothing becomes
          # unobtainable; the `.app.tar.gz` is the updater's payload and is only
          # ever fetched for the version `latest.json` names.

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          name: Frame Player v${{ needs.check-version.outputs.version }}
          generate_release_notes: true
          body: |
            ### Installation

            | File | Description |
            |------|-------------|
            | `FramePlayer_*_x64-setup.exe` | Installer (Windows 10/11 x64) |
            | `FramePlayer_*_aarch64.dmg` | Disk image (macOS, Apple Silicon) |

            The player updates automatically: when a new version is released,
            an update button appears in the app.

            The macOS build is signed with an Apple Developer ID and notarised,
            so it opens the way any other application does.
          files: |
            dist/*.exe
            dist/*.dmg
            dist/latest.json

      # Last, and a step of its own. It used to sit at the end of the upload,
      # which put the least important thing in this job in front of the most
      # important one: a missing script killed that step, so the release was
      # never created even though every artifact had already been uploaded and
      # latest.json was live. Housekeeping must not be able to do that. It still
      # fails loudly rather than being swallowed — pruning that quietly stopped
      # working is how the bucket reached nine gigabytes in the first place.
      - name: Prune old releases from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          set -euo pipefail
          endpoint="https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          bucket="${{ vars.R2_BUCKET_UPDATES }}"
          [ -n "$bucket" ] || { echo "R2_BUCKET_UPDATES is not set" >&2; exit 1; }
          scripts/r2-retain.sh --kind updates --bucket "$bucket" \
            --endpoint "$endpoint" --keep 5 --apply | tee -a "$GITHUB_STEP_SUMMARY"
