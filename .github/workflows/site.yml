name: Site

# The landing page is deployed by a reviewed commit, not by a hand on a
# terminal: every push to main that touches it builds, type-checks and goes out.
# A pull request builds the same way and gets its own preview address.
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/site.yml']
  pull_request:
    paths: ['site/**', '.github/workflows/site.yml']
  workflow_dispatch:

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

defaults:
  run:
    working-directory: site

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Wrangler 4 requires Node 22.19 or newer; Astro is happy either way.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        env:
          # A preview build asks search engines to stay away (astro.config.ts);
          # production keeps the canonical origin.
          SITE_ORIGIN: ${{ github.event_name == 'pull_request' && '' || 'https://frameplayer.app' }}
          SITE_PREVIEW: ${{ github.event_name == 'pull_request' && '1' || '' }}
          # The same variable the release workflow publishes to. With it the
          # download buttons hand over the installer itself, named with the
          # version; without it they fall back to the GitHub release page.
          UPDATES_ORIGIN: ${{ vars.R2_PUBLIC_URL_UPDATES }}
        run: npm run build

      # Prints which account the token can see and which permissions it carries.
      # A deploy that fails with "No access to the specified resource" says
      # nothing about which of the two secrets is wrong; this does.
      - name: Check Cloudflare credentials
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler whoami

      - name: Deploy
        if: github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          command: deploy

      # Forks do not get the secrets, so they build and stop there.
      - name: Upload preview version
        id: preview
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          command: versions upload

      - name: Comment the preview address
        if: steps.preview.outputs.deployment-url != ''
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.deployment-url }}
        with:
          script: |
            const marker = '<!-- site-preview -->'
            const body = `${marker}\nSite preview of ${context.sha.slice(0, 7)}: ${process.env.PREVIEW_URL}`
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number,
            })
            const mine = comments.find((c) => c.body?.startsWith(marker))
            if (mine) await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body })
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body })
