# The frontend gates, on every push and pull request.
#
# Until now the only workflow was `release.yml`, which is gated on a version bump
# — so nothing checked an ordinary commit, and the four gates only ran when
# somebody remembered to run them. Each of them exists because it catches a class
# of mistake the compiler does not (see the notes at the top of each script), and
# a gate nobody runs is a comment.
#
# The Rust half is a workflow of its own, `rust.yml`: it needs libmpv and the
# FFmpeg SDK, its own caches and two platforms, and it runs only when something
# under `src-tauri/` changed — none of which belongs in a job that runs on every
# push and finishes in a minute.
#
# The watch-together relay IS covered, because it costs nothing to: it is Go with
# one dependency and no native libraries at all. That matters for more than the
# relay's own tests — `shared/sync-protocol.txt` is a contract between two
# languages, and a contract only one side of which runs on every push is a
# contract with one signature.
name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup toolchain
        uses: moonrepo/setup-toolchain@v0
        with:
          # Node and bun at exactly the versions `.prototools` pins — the file
          # proto reads on a developer's machine, so CI cannot drift from it.
          auto-install: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # svelte-check, then the three things it cannot see: a `$effect` at a
      # module's top level (throws on import, builds clean), an import cycle, and
      # a CSS rule whose markup went to another component. Then the unit tests.
      - name: Gates
        run: bun run gates

  services:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: |
            services/relay/go.sum
            services/tmdb/go.mod

      # `-race` because the relay's whole shape is concurrent — a room's lock, a
      # per-member outbox, a sweeper — and a data race there is exactly the kind
      # of bug that shows up as one viewer's timeline being wrong once a week.
      #
      # `-count=1` is belt and braces: the protocol test disables its own caching
      # (the fixture lives outside the Go module, so the build cache does not
      # track it — see the note in `protocol_test.go`), and a fresh runner has no
      # cache anyway. It costs nothing and it stops a future edit to that test
      # from silently re-enabling the trap.
      # `frameplayer/...` rather than `./...`: the repository root is not itself a
      # module, so a path pattern rooted there matches nothing and reports it in
      # a way that reads like a broken workspace. The module-path pattern covers
      # both services by their shared prefix.
      - name: Services
        run: |
          go vet frameplayer/...
          go build frameplayer/...
          go test -race -count=1 frameplayer/...
