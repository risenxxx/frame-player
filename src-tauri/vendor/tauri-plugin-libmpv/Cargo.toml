# tauri-plugin-libmpv 0.3.2 from crates.io, vendored for its Linux backend —
# see ../README.md. The Windows/macOS half is the registry's code unchanged.
[package]
name = "tauri-plugin-libmpv"
version = "0.3.2"
authors = ["22"]
description = "A Tauri plugin for embedding the mpv player in your app via libmpv."
edition = "2021"
rust-version = "1.77.2"
license = "MPL-2.0"
repository = "https://github.com/nini22P/tauri-plugin-libmpv"
links = "tauri-plugin-libmpv"
build = "build.rs"

[lib]
name = "tauri_plugin_libmpv"
path = "src/lib.rs"

[dependencies]
tauri = { version = "2.9.3", features = [] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
raw-window-handle = "0.6.2"
log = "0.4.28"
libc = "0.2.177"
base64 = "0.22.1"
scopeguard = "1.2.0"
indexmap = { version = "2.12.1", features = ["serde"] }
libloading = "0.8.9"
once_cell = "1.21.3"

# Linux (added here): libmpv's render API into a GtkGLArea under the web view
# (src/linux/). The same gtk-rs generation tauri's own wry/tao already link, so
# nothing new enters the tree — only names for the types tauri hands out.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
gdk = "0.18"
glib = "0.18"
webkit2gtk = "2.0"

[build-dependencies]
tauri-plugin = { version = "2.5.1", features = ["build"] }
